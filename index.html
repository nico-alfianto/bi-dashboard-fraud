<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BI Dashboard - Sistem Pengawasan Fraud Real-Time</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
       .container { max-width: 1600px; margin: auto; }
        h1 { color: #58a6ff; text-align: center; }
       .status { text-align: center; color: #3fb950; font-weight: bold; }
       .kpi { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin: 20px 0; }
       .kpi-box { background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; text-align: center; }
       .kpi-box h3 { margin: 0; font-size: 12px; color: #8b949e; }
       .kpi-box p { margin: 8px 0 0; font-size: 22px; font-weight: bold; color: #58a6ff; }
       .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
       .chart-card,.table-card { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
       .alert { background: #3d1f1f; border-left: 5px solid #f85149; padding: 10px; margin: 10px 0; border-radius: 5px; color: #f85149; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #30363d; }
       .fraud-row { background: rgba(248,81,73,0.2); }
        button { background: #238636; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
<audio id="alertSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
    <div class="container">
        <h1>🚨 Sistem Pengawasan Fraud Real-Time</h1>
        <p class="status" id="status">● LIVE</p>
        <button onclick="togglePause()">Pause/Resume</button>
        <button onclick="exportCSV()">Export CSV</button>

        <div id="alertBox"></div>

        <div class="kpi">
            <div class="kpi-box"><h3>Total Transaksi</h3><p id="totalTrans">50,000</p></div>
            <div class="kpi-box"><h3>Fraud Hari Ini</h3><p id="totalFraud">45</p></div>
            <div class="kpi-box"><h3>Fraud Rate</h3><p id="fraudRate">0.0900%</p></div>
            <div class="kpi-box"><h3>Kerugian</h3><p id="loss">$8,100</p></div>
            <div class="kpi-box"><h3>Jam Paling Rawan</h3><p id="peakHour">02:00</p></div>
        </div>

        <div class="grid">
            <div class="chart-card">
                <h2>Grafik Fraud per Menit</h2>
                <canvas id="lineChart"></canvas>
                <h2 style="margin-top:20px;">Heatmap Jam Rawan</h2>
                <canvas id="barChart"></canvas>
            </div>
            <div class="table-card">
                <h2>10 Transaksi Terakhir</h2>
                <table id="transTable">
                    <thead><tr><th>Waktu</th><th>Jumlah</th><th>Status</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    let isPaused = false;
    let totalTrans = 50000, totalFraud = 45;
    let fraudPerMinute = Array(20).fill(0);
    let fraudPerHour = Array(24).fill(0);
    let transactions = [];

    const lineChart = new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: { labels: Array.from({length: 20}, (_, i) => `${i}m`), datasets: [{ label: 'Fraud/Menit', data: fraudPerMinute, borderColor: '#f85149', tension: 0.4, fill: true }] }
    });
    const barChart = new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: { labels: Array.from({length: 24}, (_, i) => i), datasets: [{ label: 'Total Fraud/Jam', data: fraudPerHour, backgroundColor: '#FF8C00' }] }
    });

    function updateDashboard() {
        if(isPaused) return;
        let newTrans = Math.floor(Math.random() * 30) + 5;
        let newFraud = Math.random() < 0.08? Math.floor(Math.random() * 2) + 1 : 0;
        let amount = (Math.random() * 500).toFixed(2);
        let hour = new Date().getHours();

        totalTrans += newTrans; totalFraud += newFraud;
        fraudPerHour[hour] += newFraud;

        // Update KPI
        document.getElementById('totalTrans').innerText = totalTrans.toLocaleString();
        document.getElementById('totalFraud').innerText = totalFraud;
        document.getElementById('fraudRate').innerText = ((totalFraud / totalTrans) * 100).toFixed(4) + '%';
        document.getElementById('loss').innerText = '$' + (totalFraud * 180).toLocaleString();
        document.getElementById('peakHour').innerText = fraudPerHour.indexOf(Math.max(...fraudPerHour)) + ':00';

        // Update Charts
        fraudPerMinute.shift(); fraudPerMinute.push(newFraud); lineChart.update();
        barChart.data.datasets[0].data = fraudPerHour; barChart.update();

        // Update Tabel
        transactions.unshift({time: new Date().toLocaleTimeString(), amount: amount, status: newFraud > 0? 'FRAUD' : 'NORMAL'});
        if(transactions.length > 10) transactions.pop();
        let tbody = document.querySelector('#transTable tbody');
        tbody.innerHTML = transactions.map(t => `<tr class="${t.status==='FRAUD'?'fraud-row':''}"><td>${t.time}</td><td>$${t.amount}</td><td>${t.status}</td></tr>`).join('');

        // Alert + Sound
        if(newFraud > 0) {
            document.getElementById('alertBox').innerHTML = `<div class="alert">⚠️ ALERT: ${newFraud} Fraud Terdeteksi! Jam ${hour}:00</div>`;
            document.getElementById('alertSound').play();
            setTimeout(() => { document.getElementById('alertBox').innerHTML = ''; }, 4000);
        }
    }

    function togglePause() { isPaused =!isPaused; document.getElementById('status').innerText = isPaused? '● PAUSED' : '● LIVE'; }
    function exportCSV() {
        let csv = 'Waktu,Jumlah,Status\n' + transactions.map(t => `${t.time},$${t.amount},${t.status}`).join('\n');
        let blob = new Blob([csv], {type: 'text/csv'}); let url = URL.createObjectURL(blob);
        let a = document.createElement('a'); a.href = url; a.download = 'transaksi_fraud.csv'; a.click();
    }

    setInterval(updateDashboard, 2000); // update tiap 2 detik
</script>
</body>
</html>
